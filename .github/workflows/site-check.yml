name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Jekyll
        run: gem install jekyll -v 3.9.5 --no-document

      - name: Build site
        run: jekyll build --strict_front_matter

      - name: Check JavaScript syntax
        run: node --check utils/theme.js

      - name: Verify generated pages and assets
        run: |
          test -s _site/index.html
          test -s _site/index_zh-CN.html
          test -s _site/utils/style.css
          test -s _site/utils/theme.js
          grep -q 'publication-search-input' _site/index.html
          grep -q 'publication-search-input' _site/index_zh-CN.html

name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler: "2.4.22"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter

      - name: Check JavaScript syntax
        run: |
          node --check utils/theme.js
          node --check utils/main.js

      - name: Validate generated HTML and internal links
        run: bundle exec ruby scripts/check_site.rb _site

      - name: Verify key interactive components
        run: |
          grep -q 'publication-search-input' _site/index.html
          grep -q 'publication-search-input' _site/index_zh-CN.html

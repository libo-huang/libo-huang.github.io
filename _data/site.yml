    theme: "◐ Auto"
    recruitment1_title: Recruitment
    recruitment1_summary: Ph.D. & Master's Program
    recruitment1_body: Our group annually recruits <strong>1-2 Ph.D. students</strong> and <strong>2-3 Master's students</strong> in the fields of machine learning and deep learning. For detailed admission guidelines, please refer to the ICT, CAS <a href="https://ict.cas.cn/yjsjy/zsxx/sszs/" target="_blank" rel="noopener noreferrer">Student Enrollment</a> page (key events include the National Entrance Exam in March, the "Chunwei" Program in May, the Summer Camp in July, and the Exemption from Admission Exam in September). Interested candidates are encouraged to send their curriculum vitaes to
    recruitment2_title: Openings
    recruitment2_summary: Visitors & Inters Opportunity
    recruitment2_body: Our group offers <strong>1-2 internship, joint-training, or visiting positions</strong> annually. We welcome applications from graduate students and highly motivated undergraduates. Both remote and on-site research opportunities are available. Interested candidates are encouraged to send their curriculum vitaes to
    copyright_name: Libo Huang. All rights reserved
    build_label: "Last update: "
    more_news: More News
  zh-CN:
    logo_alt: 中国科学院计算技术研究所标志
    name: 黄礼泊
    avatar_alt: 黄礼泊
    theme: "◐ 自动"
    recruitment1_title: 学生招生
    recruitment1_summary: 硕博士研究生招生
    recruitment1_body: 本课题组每年在机器学习与深度学习领域招收<strong>1-2名博士研究生</strong>和<strong>2-3名硕士研究生</strong>。详细招生动态请关注中科院计算所<a href="https://ict.cas.cn/yjsjy/zsxx/sszs/" target="_blank" rel="noopener noreferrer">研究生招生</a> (重点关注每年3月全国统考、5月“春闱计划”、7月暑期研修班、9月推荐免试)，有意者请将个人简历发送至
    recruitment2_title: 实习招聘
    recruitment2_summary: 访问学生与实习岗位
    recruitment2_body: 本课题组每年提供<strong>1-2个实习/联培/交换/客座/访问</strong>岗位，欢迎机器学习与深度学习领域的硕博研究生及优秀本科生申请。岗位支持远程或线下开展科研工作。有意者请将个人简历发送至
    copyright_name: 黄礼泊 版权所有
    build_label: 最近更新：
    more_news: 更多动态

